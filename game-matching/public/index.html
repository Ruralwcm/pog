<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🎮 Ghép Cặp Số - 4 Đội</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; }
  
  /* LOGIN SCREEN */
  #login-screen { display: flex; justify-content: center; align-items: center; height: 100vh; }
  .login-box { background: #16213e; padding: 30px; border-radius: 12px; width: 360px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
  .login-box h1 { font-size: 28px; margin-bottom: 8px; }
  .login-box p.sub { font-size: 13px; color: #888; margin-bottom: 20px; }
  .login-box input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #334; background: #0f1a2e; color: #fff; border-radius: 8px; font-size: 15px; outline: none; }
  .login-box input:focus { border-color: #3498db; }
  .login-box button { width: 100%; padding: 12px; margin-top: 12px; background: #3498db; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; }
  .login-box button:hover { background: #2980b9; }
  .login-box .error { color: #e74c3c; font-size: 13px; margin-top: 8px; }

  /* LOBBY */
  #lobby { display: none; max-width: 800px; margin: 20px auto; padding: 20px; }
  .lobby-header { text-align: center; margin-bottom: 20px; }
  .lobby-header h1 { font-size: 24px; }
  .team-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0; }
  .team-card { border-radius: 10px; padding: 16px; text-align: center; cursor: pointer; border: 3px solid transparent; transition: all 0.2s; background: #16213e; }
  .team-card:hover { transform: scale(1.02); }
  .team-card.selected { border-color: #fff; box-shadow: 0 0 15px rgba(255,255,255,0.2); }
  .team-card h3 { font-size: 18px; margin-bottom: 4px; }
  .team-card .count { font-size: 12px; opacity: 0.7; }
  .team-card .members { font-size: 11px; opacity: 0.6; margin-top: 4px; }
  .player-list { margin-top: 16px; background: #16213e; border-radius: 8px; padding: 12px; }
  .player-list h3 { font-size: 14px; margin-bottom: 8px; }
  .player-item { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13px; border-bottom: 1px solid #222; }
  .player-item:last-child { border-bottom: none; }
  .admin-panel { margin-top: 20px; text-align: center; }
  .admin-panel button { padding: 14px 40px; font-size: 18px; margin: 4px; }
  .btn-start { background: #2ecc71; color: #fff; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; }
  .btn-start:hover { background: #27ae60; }
  .btn-reset { background: #e74c3c; color: #fff; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; }
  .btn-reset:hover { background: #c0392b; }
  .waiting { text-align: center; color: #888; font-size: 14px; margin: 20px 0; }

  /* GAME */
  #game { display: none; max-width: 900px; margin: 0 auto; padding: 8px; }
  .game-header { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #16213e; border-radius: 8px; margin-bottom: 8px; flex-wrap: wrap; gap: 6px; }
  .game-header .my-team { font-weight: 700; font-size: 14px; }
  .scoreboard { display: flex; gap: 8px; }
  .score-item { padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 700; }
  .grid-container { display: grid; grid-template-columns: repeat(20, 1fr); gap: 1px; background: #0f1a2e; border-radius: 4px; padding: 2px; }
  .cell { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; border-radius: 3px; cursor: pointer; background: #1e2d3d; color: transparent; transition: all 0.15s; user-select: none; min-width: 0; overflow: hidden; }
  .cell:hover { filter: brightness(1.3); }
  .cell.revealed { background: #2c3e50; color: #fff; }
  .cell.matched { opacity: 0.5; cursor: default; }
  .cell.matched:hover { filter: none; }
  .cell.team-0.revealed { background: #c0392b; }
  .cell.team-1.revealed { background: #2471a3; }
  .cell.team-2.revealed { background: #1e8449; }
  .cell.team-3.revealed { background: #b8860b; }
  .cell.team-0.matched { background: #78281f; color: #f1948a; }
  .cell.team-1.matched { background: #154360; color: #85c1e9; }
  .cell.team-2.matched { background: #145a32; color: #82e0aa; }
  .cell.team-3.matched { background: #7d6608; color: #f9e79f; }

  .win-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 100; justify-content: center; align-items: center; }
  .win-box { text-align: center; padding: 40px; border-radius: 16px; }
  .win-box h2 { font-size: 32px; margin-bottom: 12px; }
  .win-box p { font-size: 16px; opacity: 0.8; margin-bottom: 16px; }

  @media (max-width: 600px) {
    .cell { font-size: 7px; }
    .grid-container { gap: 0.5px; padding: 1px; }
    .cell { border-radius: 1px; }
    .game-header { font-size: 11px; }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <h1>🎮 Ghép Cặp Số</h1>
    <p class="sub">Matrix 20×20 · 4 Đội · 100 số</p>
    <input type="text" id="name-input" placeholder="Tên người chơi" autocomplete="off">
    <input type="password" id="pass-input" placeholder="Mật khẩu (nếu là Quản Trò)" autocomplete="off">
    <button onclick="doLogin()">🎯 Vào Game</button>
    <div class="error" id="login-error"></div>
    <p style="font-size:11px;color:#555;margin-top:12px;">Quản Trò: haodt / 12345</p>
  </div>
</div>

<!-- LOBBY -->
<div id="lobby">
  <div class="lobby-header">
    <h1>🎮 Ghép Cặp Số - Lobby</h1>
    <p style="color:#888;font-size:13px;" id="my-info"></p>
  </div>
  
  <div class="team-grid" id="team-grid"></div>
  
  <div class="player-list"><h3>👥 Người chơi online</h3><div id="player-list-content">Đang chờ...</div></div>
  
  <div id="admin-controls" style="display:none;">
    <div class="admin-panel">
      <button class="btn-start" onclick="startGame()">🚀 BẮT ĐẦU GAME</button>
      <button class="btn-reset" onclick="resetGame()">🔄 Reset Game</button>
    </div>
  </div>

  <div id="player-waiting" class="waiting">⏳ Chờ Quản Trò bắt đầu game...</div>
</div>

<!-- GAME -->
<div id="game">
  <div class="game-header">
    <div class="my-team" id="my-team-label"></div>
    <div class="scoreboard" id="scoreboard"></div>
    <div style="font-size:12px;opacity:0.6" id="team-members-label"></div>
  </div>
  <div class="grid-container" id="grid"></div>
</div>

<div class="win-overlay" id="win-overlay">
  <div class="win-box" id="win-box"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
let myId = null;
let isAdmin = false;
let myTeam = -1;
let myColor = null;
let gameStarted = false;
let gameOver = false;

// ============= LOGIN =============
function doLogin() {
  const name = document.getElementById('name-input').value.trim();
  const pass = document.getElementById('pass-input').value.trim();
  const errEl = document.getElementById('login-error');
  
  if (!name) { errEl.textContent = 'Vui lòng nhập tên!'; return; }
  
  socket.emit('login', { name, password: pass });
}

socket.on('login_ok', (data) => {
  myId = data.id;
  isAdmin = data.isAdmin;
  
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('lobby').style.display = 'block';
  document.getElementById('my-info').textContent = `${isAdmin ? '🔑 Quản Trò' : '👤 Người chơi'}: ${document.getElementById('name-input').value.trim()} (ID: ${myId})`;
  
  if (isAdmin) {
    document.getElementById('admin-controls').style.display = 'block';
    document.getElementById('player-waiting').style.display = 'none';
  }
  
  renderTeamGrid();
});

socket.on('login_error', (msg) => {
  document.getElementById('login-error').textContent = msg;
});

// ============= TEAM =============
function renderTeamGrid() {
  const container = document.getElementById('team-grid');
  const colors = ['#e74c3c', '#3498db', '#2ecc71', '#f39c12'];
  const names = ['ĐỘI ĐỎ 🔴', 'ĐỘI XANH DƯƠNG 🔵', 'ĐỘI XANH LÁ 🟢', 'ĐỘI VÀNG 🟡'];
  const descs = ['100 ô · 50 cặp', '100 ô · 50 cặp', '100 ô · 50 cặp', '100 ô · 50 cặp'];
  
  container.innerHTML = '';
  for (let i = 0; i < 4; i++) {
    const card = document.createElement('div');
    card.className = 'team-card';
    card.style.borderColor = colors[i];
    card.innerHTML = `<h3 style="color:${colors[i]}">${names[i]}</h3><p class="count">${descs[i]}</p><p class="members" id="team-members-${i}"></p>`;
    card.onclick = () => joinTeam(i);
    if (myTeam === i) card.classList.add('selected');
    container.appendChild(card);
  }
}

function joinTeam(team) {
  if (gameStarted) return;
  socket.emit('join_team', { team });
}

socket.on('team_joined', (data) => {
  myTeam = data.team;
  myColor = data.color;
  renderTeamGrid();
  document.getElementById('player-waiting').style.display = isAdmin ? 'none' : 'block';
});

// ============= PLAYER LIST =============
socket.on('player_list', (list) => {
  const el = document.getElementById('player-list-content');
  const colors = ['🔴', '🔵', '🟢', '🟡'];
  
  if (list.length === 0) {
    el.innerHTML = '<span style="color:#888">Chưa có người chơi...</span>';
    return;
  }
  
  el.innerHTML = list.map(p => {
    const roleIcon = p.isAdmin ? '🔑 ' : '';
    const teamIcon = p.team >= 0 ? colors[p.team] : '⚪';
    return `<div class="player-item"><span>${roleIcon}${p.name}</span><span>${teamIcon}</span></div>`;
  }).join('');
  
  // Update team member counts
  for (let t = 0; t < 4; t++) {
    const members = list.filter(p => p.team === t).map(p => p.name).join(', ');
    const el2 = document.getElementById(`team-members-${t}`);
    if (el2) el2.textContent = members || '(0 người)';
  }
});

// ============= ADMIN =============
function startGame() {
  socket.emit('admin_start');
}

function resetGame() {
  socket.emit('admin_reset');
}

socket.on('game_reset', () => {
  gameStarted = false;
  gameOver = false;
  myTeam = -1;
  document.getElementById('game').style.display = 'none';
  document.getElementById('lobby').style.display = 'block';
  document.getElementById('win-overlay').style.display = 'none';
  renderTeamGrid();
});

// ============= GAME =============
socket.on('game_started', (data) => {
  gameStarted = true;
  gameOver = false;
  document.getElementById('lobby').style.display = 'none';
  document.getElementById('game').style.display = 'block';
  
  document.getElementById('my-team-label').innerHTML = myTeam >= 0
    ? `<span style="color:${myColor}">ĐỘI CỦA BẠN</span>`
    : '<span style="color:#888">👀 Khán giả</span>';
  
  // Build grid
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  for (let i = 0; i < data.size * data.size; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.id = `cell-${i}`;
    cell.onclick = () => revealCell(i);
    grid.appendChild(cell);
  }
  
  updateScoreboard(data.teams);
});

function revealCell(index) {
  if (gameOver || myTeam < 0) return;
  socket.emit('reveal_cell', { cellIndex: index });
}

socket.on('cell_revealed', (data) => {
  const el = document.getElementById(`cell-${data.cellIndex}`);
  if (!el) return;
  el.textContent = data.num;
  el.classList.add('revealed', `team-${data.team}`);
});

socket.on('pair_matched', (data) => {
  data.cells.forEach(idx => {
    const el = document.getElementById(`cell-${idx}`);
    if (!el) return;
    el.classList.add('matched');
    el.textContent = data.num;
  });
  
  // Play a quick flash
  const color = data.color;
  data.cells.forEach(idx => {
    const el = document.getElementById(`cell-${idx}`);
    if (el) {
      el.style.boxShadow = `0 0 10px ${color}`;
      setTimeout(() => el.style.boxShadow = '', 500);
    }
  });
  
  updateScoreboard();
});

socket.on('game_won', (data) => {
  gameOver = true;
  const overlay = document.getElementById('win-overlay');
  const box = document.getElementById('win-box');
  box.style.background = data.color;
  box.style.color = '#fff';
  box.innerHTML = `
    <h2>🏆 ${data.colorName} CHIẾN THẮNG!</h2>
    <p>Đã tìm được ${data.score} cặp số!</p>
    <p style="font-size:13px;opacity:0.7">Chờ Quản Trò reset để chơi lại...</p>
  `;
  overlay.style.display = 'flex';
});

socket.on('wrong_team', (data) => {
  // Briefly flash red
  const el = document.getElementById(`cell-${data.cellIndex}`);
  if (el) {
    el.style.background = '#333';
    setTimeout(() => el.style.background = '', 300);
  }
});

function updateScoreboard(teams) {
  const el = document.getElementById('scoreboard');
  const colors = ['#e74c3c', '#3498db', '#2ecc71', '#f39c12'];
  const names = ['Đỏ', 'Xanh Dương', 'Xanh Lá', 'Vàng'];
  
  el.innerHTML = '';
  for (let t = 0; t < 4; t++) {
    const score = (teams && teams[t]) ? teams[t].score : 0;
    const span = document.createElement('span');
    span.className = 'score-item';
    span.style.background = colors[t] + '33';
    span.style.color = colors[t];
    span.textContent = `${names[t]}: ${score}/2`;
    if (t === myTeam) span.style.border = `2px solid ${colors[t]}`;
    el.appendChild(span);
  }
  
  // Update team members label
  if (teams && myTeam >= 0 && teams[myTeam]) {
    const label = document.getElementById('team-members-label');
    if (label) label.textContent = `👥 ${(teams[myTeam].players || []).length} người trong đội`;
  }
}
</script>
</body>
</html>
